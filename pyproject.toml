[project]
name = "nba"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.4",
    "nba-api>=1.11.4",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "scikit-learn>=1.9.0",
    "torch>=2.4.0",
    "tqdm>=4.68.3",
]

[project.scripts]
nba-ingest = "nba_predictor.data.ingest:main"
nba-ingest-inactives = "nba_predictor.data.ingest:inactives_main"
nba-process = "nba_predictor.data.process:main"
nba-predict = "nba_predictor.prediction:main"
nba-evaluate = "nba_predictor.evaluation:main"
nba-evaluate-baselines = "nba_predictor.evaluation:baselines_main"
nba-train-logistic = "nba_predictor.logistic_regression:train_main"
nba-inspect-logistic = "nba_predictor.logistic_regression:inspect_main"
nba-evaluate-logistic = "nba_predictor.logistic_regression:evaluate_main"
nba-predict-logistic = "nba_predictor.logistic_regression:predict_main"
nba-ablate-logistic = "nba_predictor.logistic_regression:ablate_main"
nba-train-random-forest = "nba_predictor.random_forest:train_main"
nba-inspect-random-forest = "nba_predictor.random_forest:inspect_main"
nba-evaluate-random-forest = "nba_predictor.random_forest:evaluate_main"
nba-predict-random-forest = "nba_predictor.random_forest:predict_main"
nba-train-lstm = "nba_predictor.lstm:train_main"
nba-inspect-lstm = "nba_predictor.lstm:inspect_main"
nba-evaluate-lstm = "nba_predictor.lstm:evaluate_main"
nba-predict-lstm = "nba_predictor.lstm:predict_main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nba_predictor = ["py.typed"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pandas-stubs>=3.0.3.260530",
    "pytest>=9.1.0",
    "ruff>=0.15.17",
    "scikit-learn-stubs>=0.0.3",
]
